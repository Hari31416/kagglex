site_name: kagglex
site_description: Seamlessly execute Python code, modules, and experiments on Kaggle GPUs and TPUs.
site_author: Harikesh Kushwaha
site_url: https://hari31416.github.io/kagglex/
repo_url: https://github.com/Hari31416/kagglex
repo_name: Hari31416/kagglex

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - User Guide:
      - Running Experiments: user-guide/running-experiments.md
      - Interactive REPL: user-guide/interactive-repl.md
      - Datasets & Payloads: user-guide/datasets.md
      - Quota Tracking: user-guide/quota.md
      - Configuration Hierarchy: user-guide/configuration.md
      - Workspaces & Packaging: user-guide/workspaces.md
  - CLI Reference: cli-reference.md
  - Python API: python-api.md
  - Troubleshooting: troubleshooting.md
